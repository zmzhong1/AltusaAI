name: Public release safety

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private planning files
        shell: bash
        run: |
          forbidden=(
            "_planning"
            "DEMO-SPEC.md"
            "FEATURE-COVERAGE.md"
            "HANDOFF.md"
          )
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Public release contains prohibited path: $path" >&2
              exit 1
            fi
          done

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
